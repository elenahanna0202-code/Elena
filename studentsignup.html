<html>
<head>
<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9edf2;
}


.container{
    width: 92%;
    height: 92vh;
    display: flex;
    border-radius: 25px;
    overflow: hidden;
    background: white;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}


.left{
    width: 60%;
    background: 
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://www.usg.edu/assets/global/images/inst_thumbnails_large/vsu_thumb.jpg");
    
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}


.left-content{
    color: white;
    text-align: center;
    padding: 20px;
}

.left-content h1{
    font-size: 52px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

.left-content p{
    font-size: 18px;
    font-weight: 300;
    opacity: 0.9;
}


.right{
    width: 40%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}


.login-box{
    width: 400px;
    padding: 45px;
    border-radius: 20px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}


.login-box h2{
    text-align: center;
    font-size: 34px;
    color: #222;
    margin-bottom: 8px;
}

.login-box .subtitle{
    text-align: center;
    color: #777;
    margin-bottom: 30px;
    font-size: 14px;
}


.login-box label{
    font-size: 14px;
    color: #444;
    font-weight: 500;
}


.login-box input{
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    margin-bottom: 20px;
    border: 1px solid #dcdcdc;
    border-radius: 12px;
    outline: none;
    transition: 0.3s;
    font-size: 14px;
}

.login-box input:focus{
    border-color: #4a5cff;
    box-shadow: 0 0 8px rgba(74,92,255,0.2);
}


.options{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    font-size: 13px;
}

.options a{
    text-decoration: none;
    color: #4a5cff;
}


.login-box button{
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a5cff, #6d7dff);
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
}

.login-box button:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(74,92,255,0.35);
}


.footer{
    text-align: center;
    margin-top: 22px;
    color: #888;
    font-size: 13px;
}

.cb {
border: solid black 1px;
}

</style>
</head>
<body>

<div class="container">

    
    <div class="left">
        <div class="left-content">
            <h1>USG University</h1>
            <p>Excellence in Education. Leadership for Tomorrow.</p>
        </div>
    </div>

    
    <div class="right">

        <div class="login-box">

            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to USG account</p>

            <label>Username or Email</label>
            <input type="text" placeholder="Enter your username">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <div class="options">
                <label>
                   
                    Remember me
              </label>
                    <input type="checkbox" id="cb" checked >    

            <a href="#">Forgot password?</a>
            </div>

<a href="studentdashbord.html">
            <button>Sign In</button>
</a>

            <p class="footer">
                Need help? Contact IT Support
            </p>

        </div>

    </div>

</div>

</body>
</html>
