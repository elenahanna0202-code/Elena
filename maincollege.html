.e img {
width: 70%;
max-width: 900px;
height: auto;   
border-radius: 12px;   
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);    
transition: transform 0.3s ease, box-shadow 0.3s ease;
}


.e img:hover {
transform: scale(1.02);
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
}

.rankings {
  position: absolute;
  top: 15px;
  left: 20px;
  display: flex;
  gap: 10px;
}

.rankings img {
  height: 230px;
 width: 700px;
}

.i {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 10px 20px;
  font-weight: bold;
  clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
}

.i::after {
  content: "📣";
  margin-left: 8px;
}

.j {
  background: #eaeaea;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
}

.k {
  background: #fff;
  padding: 25px 50px;
  position: relative;
}

.k .l {
  background: #333;
  color: white;
  font-size: 22px;
  font-weight: bold;
  padding: 12px 30px;
  position: relative;
  display: inline-block;
}

.k .l::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 0;
  width: 0;
  height: 0;
  border-top: 25px solid transparent;
  border-bottom: 25px solid transparent;
  border-right: 15px solid #ff2e6d;
}

.k .l::after {
  content: "📣";
  margin-left: 10px;
}

.m {
  background: #b79a6b;
  padding: 50px 20px;
  text-align: center;
}

.n{
  display: grid;
  grid-template-columns: 1fr;
  gap: 35px;
  max-width: 400px;
  margin: auto;
}

.t{
  color: #1d1d1d;
}

.t i {
  font-size: 32px;
  margin-bottom: 10px;
  display: block;
}

.t span {

display: block;
}

.t:hover {
opacity: 0.8;
cursor: pointer;
